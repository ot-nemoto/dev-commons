# gitleaks（秘密情報スキャナ）の設定。
#
# このファイルは **このリポジトリ所有**。カスタムルールの接頭辞や allowlist の対象は
# リポジトリ固有のため、dev-commons からは配布しない（`.claude/project.md` と同じ扱い）。
# 実行するワークフローは `.github/workflows/secret-scan.yml`（dev-commons が配布）。
#
# ローカル実行:
#   gitleaks git . --redact -v                                   # 全履歴
#   gitleaks git . --redact -v --log-opts="--no-merges origin/develop..HEAD"  # PR 相当の差分
#   gitleaks dir . --redact -v                                   # 作業ツリー（未コミット分も含む）
#
# -v を付けないと検出時に件数しか出ない（--redact 併用で値は REDACTED になる）。
# なお git log -p はマージコミットの patch を既定で出さないため、コンフリクト解決時にのみ
# 混入した値は `gitleaks git` では拾えない。CI の週次実行は `gitleaks dir` も併せて走らせている。

[extend]
useDefault = true

[allowlist]
description = "ビルド生成物と、履歴に残る既知の公開値"

# ローカルで `gitleaks dir` を使うとビルド生成物のハッシュ値を大量に拾うため除外する
# （git スキャンでは gitignore 済みのため元々現れない）。
#
# 注意: `.env` や認証状態のファイルは**除外しない**。gitignore 済みで git スキャンには
# 現れないが、除外すると万一コミットされた場合に検出できなくなる。`gitleaks dir` では
# これらが常に検出されるが、既知として読み飛ばす。
paths = [
  '''^\.next/''',
  '''^dist/''',
  '''^out/''',
  '''^build/''',
  '''^coverage/''',
  '''^node_modules/''',
  '''^playwright-report/''',
  '''^test-results/''',
]

# 公開リポジトリの履歴に残ってしまった既知の値はここに追加する。
# より狭く抑止したい場合は `.gitleaksignore` に Fingerprint（<commit>:<file>:<rule>:<line>）を
# 書く方法もある（ワークフローは既定で読む）。値そのものを無効化したいなら下の regexes、
# 特定箇所だけ黙らせたいなら .gitleaksignore を使う。
# 除外しないと週次の全履歴スキャンが恒久的に失敗し、検査そのものが無視されるようになる。
# 追加するときは、その値が無効化済み（ローテーション済み・本番未使用など）である旨を
# コメントで必ず添えること。
# regexes = [
#   '''<履歴に残る既知の値>''',
# ]

# 自前の APIキーに接頭辞を付けている場合のカスタムルール。
# 既定ルールは自前の接頭辞を知らないため、接頭辞を実際の検出へ結びつけるのはこのルール。
# GitHub の secret scanning でこれを行うには custom patterns（有料）が必要。
#
# 形は common-rules「秘密情報スキャン（gitleaks）」を正典とする。要点:
#
# - **長さはキーの書式どおりに固定する**（base64url(32 bytes) なら 43 文字）。
#   `{20,}` のような下限指定は接頭辞始まりの定数名・Cookie 名を拾い、
#   週次の全履歴スキャンを恒久的に落とす
# - **末尾にだけ境界を置く。先頭には置かない。** 先頭に境界を置くと
#   `KEY_<prefix>_…` のように直前が [A-Za-z0-9_-] のとき本物のキーを見逃す
#   （偽陰性は偽陽性より害が大きい）
# - gitleaks の正規表現は RE2 で先読み・後読みが使えないため、境界は文字クラスで表現する
# - `secretGroup` でキー部分だけを取り出す（末尾境界が 1 文字を食うため、
#   これが無いと報告される Secret に引用符などが混ざる）
# - `entropy` は長さが一致する低エントロピーな識別子を落とす下限
#
# キーの書式を変えるときは、このルールも必ず追随させること。
# [[rules]]
# id = "<repo>-api-key"
# description = "<repo> の外部連携 APIキー（<prefix>_ prefix）"
# regex = '''(<prefix>_[A-Za-z0-9_-]{43})(?:[^A-Za-z0-9_-]|$)'''
# secretGroup = 1
# entropy = 3.5
# keywords = ["<prefix>_"]
